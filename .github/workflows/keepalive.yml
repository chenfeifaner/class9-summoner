name: Keep Cloudflare API Alive

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            https://class9-summoner-api-pages.pages.dev/api/health
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors \
            -H "Origin: https://chenfeifaner.github.io" \
            https://class9-summoner-api-pages.pages.dev/api/state \
            -o /dev/null
